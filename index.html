<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0f766e">
  <meta name="format-detection" content="telephone=no,email=no,address=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230f766e%22/%3E%3Cpath d=%22M17 19h30v26H17z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%225%22/%3E%3Cpath d=%22M25 13v12M39 13v12M25 39v12M39 39v12%22 stroke=%22white%22 stroke-width=%225%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
  <title>模具查询系统</title>
  <style>
    :root {
      --bg: #f4f7f6;
      --surface: #ffffff;
      --ink: #17211f;
      --muted: #667773;
      --line: #dce6e3;
      --primary: #0f766e;
      --primary-dark: #0b5f59;
      --primary-soft: #e6f3f1;
      --warning: #9a5b0a;
      --shadow: 0 16px 40px rgba(24, 54, 49, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #e8f2f0 0, var(--bg) 280px);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .page {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .offline-badge {
      flex: 0 0 auto;
      border: 1px solid rgba(15, 118, 110, .22);
      border-radius: 999px;
      background: rgba(255, 255, 255, .7);
      color: var(--primary-dark);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }

    .panel {
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .92);
      box-shadow: var(--shadow);
    }

    .search-panel { padding: 18px; }

    .search-row {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px auto auto;
      gap: 10px;
    }

    .search-input-wrap { position: relative; }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #71827e;
      pointer-events: none;
    }

    input, select {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    input { padding: 0 14px 0 44px; }
    select { padding: 0 36px 0 12px; }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, .12);
    }

    .btn {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: 700;
      transition: transform .15s ease, background .15s ease;
    }

    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #eef3f2; color: #38514c; }
    .btn-secondary:hover { background: #e3ecea; }

    .search-help {
      margin: 11px 2px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 22px 2px 12px;
    }

    .result-count { font-weight: 700; }
    .result-count span { color: var(--primary); }
    .result-note { color: var(--muted); font-size: 13px; }

    .table-panel { overflow: hidden; }
    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 1180px;
      border-collapse: collapse;
      background: var(--surface);
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f1f6f5;
      color: #4d625d;
      font-size: 13px;
      white-space: nowrap;
    }

    tbody tr:hover { background: #f7fbfa; }
    tbody tr:last-child td { border-bottom: 0; }
    .code { font-weight: 800; letter-spacing: .02em; }
    .muted { color: var(--muted); }

    .thumb-button {
      width: 92px;
      height: 68px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f5f8f7;
      padding: 4px;
      overflow: hidden;
    }

    .thumb-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .no-image {
      display: grid;
      place-items: center;
      width: 92px;
      height: 68px;
      border: 1px dashed #c8d5d2;
      border-radius: 10px;
      color: #8b9996;
      background: #f8faf9;
      font-size: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 4px 9px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag.repair { background: #fff2dc; color: var(--warning); }

    .cards { display: none; }

    .empty {
      display: none;
      padding: 64px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 18px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .page-btn {
      min-width: 88px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
    }

    .page-btn:disabled { cursor: default; opacity: .45; }
    .page-status { min-width: 120px; text-align: center; color: var(--muted); font-size: 13px; }

    dialog {
      width: min(900px, calc(100% - 28px));
      max-height: calc(100vh - 28px);
      border: 0;
      border-radius: 18px;
      padding: 0;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .3);
    }

    dialog::backdrop { background: rgba(10, 18, 16, .68); backdrop-filter: blur(4px); }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 13px 16px;
    }

    .modal-title { font-weight: 800; }
    .modal-close { border: 0; border-radius: 9px; background: #eef3f2; padding: 8px 12px; }

    .modal-image-wrap {
      display: grid;
      place-items: center;
      max-height: calc(100vh - 100px);
      min-height: 260px;
      padding: 18px;
      overflow: auto;
      background: #f4f7f6;
    }

    .modal-image-wrap img { display: block; max-width: 100%; max-height: calc(100vh - 140px); object-fit: contain; }

    @media (max-width: 820px) {
      .page { width: min(100% - 20px, 720px); padding-top: 22px; }
      .hero { align-items: flex-start; margin-bottom: 16px; }
      .offline-badge { margin-top: 3px; }
      .subtitle { font-size: 14px; }
      .search-panel { padding: 12px; }
      .search-row { grid-template-columns: 1fr 1fr; }
      .search-input-wrap { grid-column: 1 / -1; }
      .search-row select { grid-column: 1 / -1; }
      .btn { padding: 0 14px; }
      .result-head { align-items: flex-end; margin-top: 18px; }
      .result-note { display: none; }
      .table-panel { display: none; }
      .cards { display: grid; gap: 12px; }

      .card {
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.72);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 26px rgba(24, 54, 49, .07);
      }

      .card-image {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 180px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: #f3f7f6;
        padding: 10px;
      }

      .card-image img { width: 100%; height: 100%; object-fit: contain; }
      .card-image.no-photo { color: #8b9996; font-size: 13px; }
      .card-body { padding: 15px; }
      .card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .card-title { margin: 0; font-size: 19px; }
      .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 15px; }
      .field.wide { grid-column: 1 / -1; }
      .field-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
      .field-value { word-break: break-word; font-size: 14px; }
    }

    @media (max-width: 460px) {
      .hero { display: block; }
      .offline-badge { display: inline-block; margin-top: 14px; }
      .search-row { grid-template-columns: 1fr 1fr; }
      .card-image { height: 160px; }
    }

    @media print {
      body { background: #fff; }
      .page { width: 100%; padding: 0; }
      .hero, .search-panel, .pagination, .offline-badge { display: none !important; }
      .table-panel { display: block; box-shadow: none; border: 0; }
      table { min-width: 0; }
      th, td { padding: 6px; font-size: 10px; }
      .thumb-button, .no-image { width: 54px; height: 42px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">模具资料</p>
        <h1>模具查询系统</h1>
        <p class="subtitle">输入编号或关键词，快速查找对应模具资料</p>
      </div>
      <div class="offline-badge">微信可打开</div>
    </header>

    <section class="panel search-panel" aria-label="查询条件">
      <div class="search-row">
        <label class="search-input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="输入模具编号、原版编号、零件编号或关键词">
        </label>
        <select id="repairFilter" aria-label="维修建议筛选">
          <option value="">全部维修状态</option>
        </select>
        <button id="searchButton" class="btn btn-primary" type="button">查询</button>
        <button id="clearButton" class="btn btn-secondary" type="button">清空</button>
      </div>
      <p class="search-help">支持部分匹配。输入多个关键词时，请用空格分隔。</p>
    </section>

    <div class="result-head">
      <div class="result-count">找到 <span id="resultCount">0</span> 条记录</div>
      <div class="result-note" id="dataNote"></div>
    </div>

    <section id="tablePanel" class="panel table-panel" aria-label="查询结果表格">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>图片</th>
              <th>模具编号</th>
              <th>零件编号</th>
              <th>原版编号</th>
              <th>数量</th>
              <th>预估时间</th>
              <th>备注</th>
              <th>维修建议</th>
              <th>日期</th>
              <th>序号</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <section id="cardList" class="cards" aria-label="查询结果卡片"></section>

    <section id="emptyState" class="panel empty" aria-live="polite">
      <strong>没有找到匹配记录</strong>
      <span>请检查编号，或尝试输入更短的关键词。</span>
    </section>

    <nav id="pagination" class="pagination" aria-label="结果分页">
      <button id="prevButton" class="page-btn" type="button">上一页</button>
      <span id="pageStatus" class="page-status"></span>
      <button id="nextButton" class="page-btn" type="button">下一页</button>
    </nav>
  </main>

  <dialog id="imageDialog">
    <div class="modal-head">
      <span id="modalTitle" class="modal-title">模具图片</span>
      <button id="modalClose" class="modal-close" type="button">关闭</button>
    </div>
    <div class="modal-image-wrap">
      <img id="modalImage" alt="放大的模具图片">
    </div>
  </dialog>

  <script>
    (() => {
      'use strict';

      const records = JSON.parse(document.getElementById('recordsData').textContent);
      const images = JSON.parse(document.getElementById('imagesData').textContent);
      const pageSize = 24;

      const searchInput = document.getElementById('searchInput');
      const repairFilter = document.getElementById('repairFilter');
      const resultCount = document.getElementById('resultCount');
      const dataNote = document.getElementById('dataNote');
      const tablePanel = document.getElementById('tablePanel');
      const tableBody = document.getElementById('tableBody');
      const cardList = document.getElementById('cardList');
      const emptyState = document.getElementById('emptyState');
      const pagination = document.getElementById('pagination');

      const imageDialog = document.getElementById('imageDialog');
      const modalImage = document.getElementById('modalImage');
      const modalTitle = document.getElementById('modalTitle');

      let filteredRecords = records;
      let currentPage = 1;

      const normalize = (value) => String(value || '')
        .normalize('NFKC')
        .toLowerCase()
        .replace(/[\s\-－—–]+/g, '');

      records.forEach((record) => {
        record._search = normalize([
          record.serial,
          record.moldCode,
          record.quantity,
          record.estimate,
          record.originalCode,
          record.remarks,
          record.date,
          record.repair,
          record.partCode
        ].join(' '));
      });

      const repairOptions = [...new Set(records.map((record) => record.repair).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'zh-CN'));
      repairOptions.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        repairFilter.appendChild(option);
      });

      dataNote.textContent = `共 ${records.length} 条内置数据`;

      function appendTextCell(row, value, className = '') {
        const cell = document.createElement('td');
        cell.textContent = value || '—';
        if (!value) cell.classList.add('muted');
        if (className) cell.classList.add(className);
        row.appendChild(cell);
      }

      function openImage(record) {
        const source = images[record.imageId];
        if (!source) return;
        modalImage.src = source;
        modalTitle.textContent = record.moldCode ? `模具 ${record.moldCode}` : '模具图片';
        if (typeof imageDialog.showModal === 'function') {
          imageDialog.showModal();
        }
      }

      function createImageControl(record, mobile = false) {
        const source = images[record.imageId];
        if (!source) {
          const placeholder = document.createElement(mobile ? 'div' : 'span');
          placeholder.className = mobile ? 'card-image no-photo' : 'no-image';
          placeholder.textContent = '暂无图片';
          return placeholder;
        }

        const button = document.createElement('button');
        button.type = 'button';
        button.className = mobile ? 'card-image' : 'thumb-button';
        button.title = '点击查看大图';
        button.setAttribute('aria-label', `查看模具 ${record.moldCode || record.serial} 的图片`);

        const image = document.createElement('img');
        image.src = source;
        image.loading = 'lazy';
        image.alt = record.moldCode ? `模具 ${record.moldCode}` : '模具图片';
        button.appendChild(image);
        button.addEventListener('click', () => openImage(record));
        return button;
      }

      function createTag(value, repair = false) {
        if (!value) return document.createTextNode('—');
        const tag = document.createElement('span');
        tag.className = repair ? 'tag repair' : 'tag';
        tag.textContent = value;
        return tag;
      }

      function renderTable(items) {
        const fragment = document.createDocumentFragment();
        items.forEach((record) => {
          const row = document.createElement('tr');

          const imageCell = document.createElement('td');
          imageCell.appendChild(createImageControl(record));
          row.appendChild(imageCell);

          appendTextCell(row, record.moldCode, 'code');

          const partCell = document.createElement('td');
          partCell.appendChild(createTag(record.partCode));
          row.appendChild(partCell);

          appendTextCell(row, record.originalCode);
          appendTextCell(row, record.quantity);
          appendTextCell(row, record.estimate);
          appendTextCell(row, record.remarks);

          const repairCell = document.createElement('td');
          repairCell.appendChild(createTag(record.repair, true));
          row.appendChild(repairCell);

          appendTextCell(row, record.date);
          appendTextCell(row, record.serial, 'muted');
          fragment.appendChild(row);
        });

        tableBody.replaceChildren(fragment);
      }

      function addField(grid, label, value, wide = false, tagType = '') {
        const field = document.createElement('div');
        field.className = wide ? 'field wide' : 'field';

        const fieldLabel = document.createElement('span');
        fieldLabel.className = 'field-label';
        fieldLabel.textContent = label;

        const fieldValue = document.createElement('div');
        fieldValue.className = 'field-value';
        if (tagType) {
          fieldValue.appendChild(createTag(value, tagType === 'repair'));
        } else {
          fieldValue.textContent = value || '—';
          if (!value) fieldValue.classList.add('muted');
        }

        field.append(fieldLabel, fieldValue);
        grid.appendChild(field);
      }

      function renderCards(items) {
        const fragment = document.createDocumentFragment();
        items.forEach((record) => {
          const card = document.createElement('article');
          card.className = 'card';
          card.appendChild(createImageControl(record, true));

          const body = document.createElement('div');
          body.className = 'card-body';

          const titleRow = document.createElement('div');
          titleRow.className = 'card-title-row';
          const title = document.createElement('h2');
          title.className = 'card-title';
          title.textContent = record.moldCode || `记录 ${record.serial}`;
          titleRow.appendChild(title);
          if (record.partCode) titleRow.appendChild(createTag(record.partCode));

          const grid = document.createElement('div');
          grid.className = 'card-grid';
          addField(grid, '原版编号', record.originalCode, true);
          addField(grid, '数量', record.quantity);
          addField(grid, '预估时间', record.estimate);
          addField(grid, '备注', record.remarks, true);
          addField(grid, '维修建议', record.repair, false, 'repair');
          addField(grid, '日期', record.date);
          addField(grid, '序号', record.serial);

          body.append(titleRow, grid);
          card.appendChild(body);
          fragment.appendChild(card);
        });

        cardList.replaceChildren(fragment);
      }

      function render() {
        const totalPages = Math.max(1, Math.ceil(filteredRecords.length / pageSize));
        currentPage = Math.min(currentPage, totalPages);
        const start = (currentPage - 1) * pageSize;
        const pageItems = filteredRecords.slice(start, start + pageSize);
        const hasResults = filteredRecords.length > 0;

        resultCount.textContent = filteredRecords.length;
        tablePanel.style.display = hasResults ? '' : 'none';
        cardList.style.display = hasResults ? '' : 'none';
        emptyState.style.display = hasResults ? 'none' : 'block';
        pagination.style.display = hasResults && totalPages > 1 ? 'flex' : 'none';

        if (!hasResults) {
          tableBody.replaceChildren();
          cardList.replaceChildren();
          return;
        }

        renderTable(pageItems);
        renderCards(pageItems);
        pageStatus.textContent = `第 ${currentPage} / ${totalPages} 页`;
        prevButton.disabled = currentPage <= 1;
        nextButton.disabled = currentPage >= totalPages;
      }

      function runSearch() {
        const keywords = searchInput.value.trim().split(/\s+/).filter(Boolean).map(normalize);
        const repair = repairFilter.value;
        filteredRecords = records.filter((record) => {
          const keywordMatch = keywords.every((keyword) => record._search.includes(keyword));
          const repairMatch = !repair || record.repair === repair;
          return keywordMatch && repairMatch;
        });
        currentPage = 1;
        render();
      }

      document.getElementById('searchButton').addEventListener('click', runSearch);
      document.getElementById('clearButton').addEventListener('click', () => {
        searchInput.value = '';
        repairFilter.value = '';
        filteredRecords = records;
        currentPage = 1;
        render();
        searchInput.focus();
      });
      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') runSearch();
      });
      repairFilter.addEventListener('change', runSearch);

      prevButton.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage -= 1;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
      nextButton.addEventListener('click', () => {
        const totalPages = Math.ceil(filteredRecords.length / pageSize);
        if (currentPage < totalPages) {
          currentPage += 1;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      document.getElementById('modalClose').addEventListener('click', () => imageDialog.close());
      imageDialog.addEventListener('click', (event) => {
        if (event.target === imageDialog) imageDialog.close();
      });
      imageDialog.addEventListener('close', () => {
        modalImage.removeAttribute('src');
      });

      render();
    })();
  </script>
</body>
</html>
